name: Build Springtrap Windows package

on:
  workflow_dispatch:
  push:
    branches: [springtrap-rewrite]
    paths:
      - "springtrap/**"
      - ".github/workflows/springtrap-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Build application
        working-directory: springtrap
        run: pyinstaller --noconfirm --clean --onedir --windowed --name Springtrap app.py
      - name: Add launcher and instructions
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not defined GEMINI_API_KEY (
            echo Enter Gemini API key. It will not be saved to disk.
            set /p "GEMINI_API_KEY=API key: "
          )
          if not defined GEMINI_API_KEY (
            echo Missing API key. Springtrap cannot contact Gemini.
            pause
            exit /b 1
          )
          start "" "%~dp0Springtrap\Springtrap.exe"
          '@ | Set-Content -Encoding ascii springtrap/dist/start-springtrap.bat
          @'
          SPRINGTRAP WINDOWS PROTOTYPE
          
          1. Extract the whole ZIP.
          2. Double-click start-springtrap.bat.
          3. Paste your Gemini API key into the console prompt. Do not send it in chat or commit it to GitHub.
          
          This is an early prototype. Voice recognition and Czech voices depend on Windows configuration.
          Screen analysis sends a screenshot to Gemini only after an in-app confirmation.
          '@ | Set-Content -Encoding utf8 springtrap/dist/README-FIRST.txt
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path springtrap/dist/* -DestinationPath Springtrap-Windows.zip -Force
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: Springtrap-Windows
          path: Springtrap-Windows.zip
          if-no-files-found: error
          retention-days: 14
