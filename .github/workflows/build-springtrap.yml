name: Build Springtrap Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - springtrap-rewrite
    paths:
      - "springtrap/**"
      - ".github/workflows/build-springtrap.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        working-directory: springtrap
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Springtrap app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Springtrap-Windows-x64
          path: springtrap/dist/Springtrap.exe
          if-no-files-found: error
          retention-days: 14
