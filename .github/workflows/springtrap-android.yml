name: Springtrap Android Build

on:
  push:
    branches: [springtrap-android]
    paths:
      - 'springtrap-android/**'
      - '.github/workflows/springtrap-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: springtrap-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: springtrap-android-debug
          path: springtrap-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
