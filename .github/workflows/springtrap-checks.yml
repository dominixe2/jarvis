name: Springtrap prototype checks

on:
  push:
    branches: [springtrap-rewrite]
    paths:
      - "springtrap/**"
      - ".github/workflows/springtrap-checks.yml"
  pull_request:
    paths:
      - "springtrap/**"
      - ".github/workflows/springtrap-checks.yml"
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: springtrap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests (no API key required)
        run: python -m unittest discover -s tests -v
